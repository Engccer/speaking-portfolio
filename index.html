<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 말하기 녹음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>3학년 영어B 말하기 포트폴리오</h1></header>
<main id="main">
  <div id="live" aria-live="polite" class="live"></div>

  <section id="screen-entry" class="screen">
    <h2 tabindex="-1">입장</h2>
    <form id="entry-form">
      <p><label>반 <select name="cls" required>
        <option value="">반 선택</option>
        <option value="1">1반</option><option value="2">2반</option>
        <option value="3">3반</option><option value="4">4반</option>
        <option value="5">5반</option><option value="6">6반</option>
      </select></label></p>
      <div class="number-field">
        <label for="student-number" id="number-label">번호</label>
        <input type="text" id="student-number" name="num" inputmode="numeric" autocomplete="off"
          role="combobox" aria-expanded="false" aria-controls="number-options" aria-autocomplete="none" required>
        <ul id="number-options" class="number-options" role="listbox" aria-labelledby="number-label" hidden></ul>
      </div>
      <p><label>이름 <input type="text" name="name" autocomplete="off" required></label></p>
      <p id="entry-error" class="error"></p>
      <button type="submit">입장하기</button>
    </form>
  </section>

  <section id="screen-mode" class="screen" hidden>
    <h2 tabindex="-1">평가 선택</h2>
    <p id="mode-greeting"></p>
    <p id="mode-note"></p>
    <p>
      <button type="button" id="btn-practice">모의 평가 참여하기</button>
      <button type="button" id="btn-exam" disabled>본 평가 참여하기</button>
    </p>
  </section>

  <section id="screen-mic" class="screen" hidden>
    <h2 tabindex="-1">마이크 준비</h2>
    <p>헤드폰을 연결하고 [마이크 테스트하기]를 누르세요. 3초 동안 녹음한 뒤 자동으로 들려줍니다.</p>
    <p id="mic-status"></p>
    <p>
      <button type="button" id="btn-mic-test">마이크 테스트하기</button>
      <button type="button" id="btn-mic-next" disabled>녹음 시작하기</button>
    </p>
  </section>

  <section id="screen-record" class="screen" hidden>
    <h2 tabindex="-1" id="record-title"></h2>
    <p id="record-source"></p>
    <p><button type="button" id="btn-play-all">공식 음원 재생하기</button></p>
    <ol id="unit-list" class="units"></ol>
    <p>
      <button type="button" id="btn-prev-dialogue" hidden>대화 1 녹음하기</button>
      <button type="button" id="btn-next" disabled></button>
    </p>
  </section>

  <section id="screen-submit" class="screen" hidden>
    <h2 tabindex="-1">제출</h2>
    <ul id="submit-summary"></ul>
    <p><button type="button" id="btn-preview">내 녹음 전체 재생하기</button></p>
    <p id="submit-status"></p>
    <p>
      <button type="button" id="btn-back-record">녹음 수정하기</button>
      <button type="button" id="btn-submit">제출하기</button>
    </p>
  </section>

  <section id="screen-done" class="screen" hidden>
    <h2 tabindex="-1">제출 완료</h2>
    <p id="done-text"></p>
    <p><button type="button" id="btn-restart" hidden>처음부터 참여하기</button></p>
  </section>

  <section id="screen-teacher" class="screen" hidden>
    <h2 tabindex="-1">교사 대시보드</h2>
    <p>
      <button type="button" id="btn-teacher-refresh">현황 새로고침하기</button>
      <button type="button" id="btn-teacher-exit">퇴장하기</button>
    </p>
    <p id="teacher-status"></p>
    <div id="teacher-classes"></div>
  </section>
</main>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title">제출 확인</h2>
    <p>제출하면 다시 녹음할 수 없습니다. 제출할까요?</p>
    <p><button value="cancel">취소하기</button> <button value="ok" id="confirm-ok">제출하기</button></p>
  </form>
</dialog>

<dialog id="return-dialog" aria-labelledby="return-title" aria-describedby="return-detail">
  <form method="dialog">
    <h2 id="return-title">제출 되돌려주기</h2>
    <p id="return-detail"></p>
    <p><button value="cancel" id="return-cancel">취소하기</button> <button value="ok">되돌려주기</button></p>
  </form>
</dialog>

<script type="module" src="app.js?v=class-admission"></script>
</body>
</html>
